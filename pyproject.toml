[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope"
version = "1.0.0"
description = "Network Diagnostics & Intelligence Toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Environment :: Console",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/atilla-reality/Netscope"
Repository = "https://github.com/atilla-reality/Netscope"
Issues = "https://github.com/atilla-reality/Netscope/issues"

[project.scripts]
netscope = "netscope.cli:main"

[tool.setuptools.packages.find]
include = ["netscope*"]
